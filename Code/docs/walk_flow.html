<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @page { size: 1280px 720px; margin: 0; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ -webkit-print-color-adjust:exact; print-color-adjust:exact;
    width:1280px; height:720px; overflow:hidden; }
  body{ font-family:'Montserrat',sans-serif; }
  svg{ display:block; }
  svg text{ font-family:'Montserrat',sans-serif; }
</style>
</head>
<body>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b95880"/><stop offset="0.5" stop-color="#ca6071"/>
      <stop offset="0.78" stop-color="#da6864"/><stop offset="1" stop-color="#e97058"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ecdfe4"/>
    </pattern>
    <marker id="arw" markerWidth="11" markerHeight="11" refX="7.5" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#7c636c"/>
    </marker>
    <style>
      .lbl{ fill:#fff; font-weight:600; font-size:11.5px; text-anchor:middle; }
      .pill{ fill:#fff; font-weight:700; font-size:12px; text-anchor:middle; }
      .dia{ fill:#fff; font-weight:700; font-size:11.5px; text-anchor:middle; }
      .num{ fill:#fff; font-weight:800; font-size:10px; text-anchor:middle; }
      .yn{ fill:#8a4a63; font-weight:800; font-size:10.5px; text-anchor:middle; letter-spacing:.5px; }
      .br{ fill:#b95880; font-weight:800; font-size:11px; letter-spacing:.4px; }
      .edge{ stroke:#7c636c; stroke-width:2; fill:none; }
      .loop{ stroke:#caa2b0; stroke-width:2; fill:none; stroke-dasharray:5 4; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#fbf7f8"/>
  <rect width="1280" height="720" fill="url(#dots)"/>

  <!-- header -->
  <rect x="24" y="20" width="1232" height="44" rx="12" fill="url(#hg)"/>
  <text x="44" y="48" fill="#fff" font-weight="800" font-size="20">RizzOtto</text>
  <text x="150" y="48" fill="#fff" font-weight="500" font-size="15">— How the robot decides to walk &amp; turn</text>
  <text x="1236" y="46" fill="#fff" font-weight="500" font-size="11" text-anchor="end">simplified gait logic</text>

  <!-- ============ NODES ============ -->

  <!-- START -->
  <rect x="18" y="338" width="150" height="58" rx="29" fill="#ca6071"/>
  <text class="pill" x="93" y="362">Robot is</text>
  <text class="pill" x="93" y="378">standing still</text>

  <!-- DECISION 1: walk or rotate -->
  <polygon points="268,310 340,367 268,424 196,367" fill="#b95880"/>
  <text class="dia" x="268" y="362">Walk or</text>
  <text class="dia" x="268" y="377">rotate?</text>

  <!-- WALK ROW (y=232) #da6864 -->
  <g fill="#da6864">
    <rect x="328" y="199" width="150" height="66" rx="11"/>
    <rect x="498" y="199" width="150" height="66" rx="11"/>
    <rect x="668" y="199" width="150" height="66" rx="11"/>
    <rect x="838" y="199" width="150" height="66" rx="11"/>
  </g>
  <!-- numbers -->
  <g><circle cx="345" cy="216" r="9" fill="#ffffff44"/><text class="num" x="345" y="219">1</text>
     <circle cx="515" cy="216" r="9" fill="#ffffff44"/><text class="num" x="515" y="219">2</text>
     <circle cx="685" cy="216" r="9" fill="#ffffff44"/><text class="num" x="685" y="219">3</text>
     <circle cx="855" cy="216" r="9" fill="#ffffff44"/><text class="num" x="855" y="219">4</text></g>
  <!-- walk texts -->
  <text class="lbl" x="403" y="231">Lift one diagonal</text><text class="lbl" x="403" y="246">pair of feet</text>
  <text class="lbl" x="573" y="224">Swing them forward —</text><text class="lbl" x="573" y="238">the planted feet</text><text class="lbl" x="573" y="252">push the body ahead</text>
  <text class="lbl" x="743" y="231">Set them down,</text><text class="lbl" x="743" y="246">lift the other pair</text>
  <text class="lbl" x="913" y="231">Push forward again</text><text class="lbl" x="913" y="246">with that pair</text>

  <!-- WALK DECISION -->
  <polygon points="1048,186 1108,232 1048,278 988,232" fill="#b95880"/>
  <text class="dia" x="1048" y="229">Walked</text><text class="dia" x="1048" y="243">far enough?</text>

  <!-- ROTATE ROW (y=500) #e97058 -->
  <g fill="#e97058">
    <rect x="328" y="467" width="150" height="66" rx="11"/>
    <rect x="498" y="467" width="150" height="66" rx="11"/>
    <rect x="668" y="467" width="150" height="66" rx="11"/>
    <rect x="838" y="467" width="150" height="66" rx="11"/>
  </g>
  <g><circle cx="345" cy="484" r="9" fill="#ffffff44"/><text class="num" x="345" y="487">1</text>
     <circle cx="515" cy="484" r="9" fill="#ffffff44"/><text class="num" x="515" y="487">2</text>
     <circle cx="685" cy="484" r="9" fill="#ffffff44"/><text class="num" x="685" y="487">3</text>
     <circle cx="855" cy="484" r="9" fill="#ffffff44"/><text class="num" x="855" y="487">4</text></g>
  <text class="lbl" x="403" y="499">Lift one diagonal</text><text class="lbl" x="403" y="514">pair of feet</text>
  <text class="lbl" x="573" y="492">Swing them — but all</text><text class="lbl" x="573" y="506">hips turn the same way,</text><text class="lbl" x="573" y="520">so the body twists</text>
  <text class="lbl" x="743" y="499">Set them down,</text><text class="lbl" x="743" y="514">lift the other pair</text>
  <text class="lbl" x="913" y="499">Twist again</text><text class="lbl" x="913" y="514">in place</text>

  <!-- ROTATE DECISION -->
  <polygon points="1048,454 1108,500 1048,546 988,500" fill="#b95880"/>
  <text class="dia" x="1048" y="497">Turned</text><text class="dia" x="1048" y="511">enough?</text>

  <!-- END -->
  <rect x="1132" y="338" width="132" height="58" rx="29" fill="#ca6071"/>
  <text class="pill" x="1198" y="362">Return to</text>
  <text class="pill" x="1198" y="378">standing pose</text>

  <!-- ============ EDGES ============ -->
  <!-- start -> decision1 -->
  <path class="edge" d="M168,367 L194,367" marker-end="url(#arw)"/>
  <!-- decision1 -> walk row (up) -->
  <path class="edge" d="M268,310 L268,232 L326,232" marker-end="url(#arw)"/>
  <text class="br" x="282" y="285" text-anchor="start">WALK</text>
  <!-- decision1 -> rotate row (down) -->
  <path class="edge" d="M268,424 L268,500 L326,500" marker-end="url(#arw)"/>
  <text class="br" x="282" y="462" text-anchor="start">ROTATE</text>

  <!-- walk row chain -->
  <path class="edge" d="M478,232 L496,232" marker-end="url(#arw)"/>
  <path class="edge" d="M648,232 L666,232" marker-end="url(#arw)"/>
  <path class="edge" d="M818,232 L836,232" marker-end="url(#arw)"/>
  <path class="edge" d="M988,232 L986,232" marker-end="url(#arw)"/>
  <!-- walk decision NO -> loop back to box1 -->
  <path class="edge" d="M1048,186 L1048,158 L403,158 L403,197" marker-end="url(#arw)"/>
  <text class="yn" x="1030" y="174" text-anchor="end">No</text>
  <!-- walk decision YES -> end -->
  <path class="edge" d="M1108,232 L1198,232 L1198,336" marker-end="url(#arw)"/>
  <text class="yn" x="1150" y="223">Yes</text>

  <!-- rotate row chain -->
  <path class="edge" d="M478,500 L496,500" marker-end="url(#arw)"/>
  <path class="edge" d="M648,500 L666,500" marker-end="url(#arw)"/>
  <path class="edge" d="M818,500 L836,500" marker-end="url(#arw)"/>
  <path class="edge" d="M988,500 L986,500" marker-end="url(#arw)"/>
  <!-- rotate decision NO -> loop back -->
  <path class="edge" d="M1048,546 L1048,574 L403,574 L403,533" marker-end="url(#arw)"/>
  <text class="yn" x="1030" y="568" text-anchor="end">No</text>
  <!-- rotate decision YES -> end -->
  <path class="edge" d="M1108,500 L1198,500 L1198,398" marker-end="url(#arw)"/>
  <text class="yn" x="1150" y="492">Yes</text>

  <!-- end -> decision1 : repeat -->
  <path class="loop" d="M1132,367 L344,367" marker-end="url(#arw)"/>
  <text class="br" x="738" y="358" text-anchor="middle" fill="#b07a90">then repeat — walk, then turn</text>

</svg>
</body>
</html>
